name: automation tests

on:
  pull_request:
    paths:
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - .github/scripts/**

permissions: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
