name: automation tests

on:
  pull_request:
    paths:
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - .github/scripts/**

permissions: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
