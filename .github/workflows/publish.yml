# Based on the workflow brew tap-new generates. Bottles are published after a formula PR merges, not before:
# `--no-cherry-pick` tells brew pr-pull the PR's commits are already on main, so it only downloads the PR's
# test-bot bottles, uploads them, and adds the bottle commit.
name: brew pr-pull

on:
  # Runs the workflow from the base branch, so a PR cannot change what runs with the App token.
  pull_request_target:
    types: [closed]
    paths:
      - Formula/**
  # Retry for a merged PR whose publish run failed.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: publish-bottles
  cancel-in-progress: false

jobs:
  pr-pull:
    # Only merged PRs from branches in this repository: their bottles were built by our own CI.
    if: >-
      github.repository == 'orin-dx/homebrew-tap' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      # The App is on the main ruleset's bypass list, so it can push the bottle commit without a PR.
      - name: Create tap-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: orin-dx
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      # brew pr-pull finds the formulae that need bottles by diffing from the merge-base of origin/HEAD and
      # GITHUB_SHA to HEAD. On main after a squash merge that diff is empty unless GITHUB_SHA is the commit
      # the PR merged onto.
      - name: Find the commit before the merge
        id: base
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
        run: |
          merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .merge_commit_sha)
          [[ -n "$merge_sha" && "$merge_sha" != null ]] || { echo "Pull request $PULL_REQUEST is not merged" >&2; exit 1; }
          base_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge_sha" --jq '.parents[0].sha')
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
        run: |
          log="$RUNNER_TEMP/pr-pull.log"
          # --clean keeps brew from amending the commit that is already on main.
          args=(--debug --retain-bottle-dir --clean --no-cherry-pick --tap="$GITHUB_REPOSITORY")
          [[ -z "$HEAD_SHA" ]] || args+=(--head-sha="$HEAD_SHA")
          set +e
          GITHUB_SHA="$BASE_SHA" brew pr-pull "${args[@]}" "$PULL_REQUEST" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            # Restoring a formula that was published before, or re-running a publish, asks to upload
            # assets its release already has. Nothing has been committed at that point, and main's
            # bottle block still points at those assets. The install check below fails if they are
            # not usable, so a wrong skip is still caught.
            if grep -q 'already_exists' "$log"; then
              echo "::warning::This PR's bottles are already released; not publishing them again."
              echo "already_released=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi

      - name: Generate build provenance
        if: steps.pull_bottles.outputs.already_released != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        if: steps.pull_bottles.outputs.already_released != 'true'
        uses: Homebrew/actions/git-try-push@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          branch: main

  # Install what was just published on each platform. A formula that compiles instead of pouring a
  # bottle means the publish did not do its job, so fail loudly.
  verify:
    needs: pr-pull
    name: Install check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM
            os: macos-26
          - label: Linux x86-64
            os: ubuntu-latest
          - label: Linux ARM
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install each published formula and require a bottle
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          # The checkout predates the bottle commit, so move to the tip of main first.
          tap_dir=$(brew --repository "$TAP_NAME")
          git -C "$tap_dir" fetch origin main
          git -C "$tap_dir" checkout --detach FETCH_HEAD
          failed=0
          formulae=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename | select(startswith("Formula/")) | sub("^Formula/"; "") | sub("\\.rb$"; "")')
          for formula in $formulae; do
            if brew install --verbose "$TAP_NAME/$formula" > install.log 2>&1 && grep -q "Pouring" install.log; then
              echo "$formula installed from a bottle"
            else
              cat install.log
              echo "::error::$formula did not install from a bottle"
              failed=1
            fi
            brew uninstall --force "$TAP_NAME/$formula" || true
          done
          exit "$failed"

  alert:
    needs: [pr-pull, verify]
    if: >-
      always() && github.repository == 'orin-dx/homebrew-tap' &&
      (needs.pr-pull.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Publishing bottles for #${PULL_REQUEST} failed" \
            --body "Publishing or the install check failed: ${RUN_URL}. Re-run publish.yml with pull_request=${PULL_REQUEST} once fixed."
